#
# ATARI PiSTorm JIT
# Master Config File
#

# select cpu type
# valid values are 68000, 68010, 68020, 68030, 68040, 68060
cpu 68030

# cpu_compatible: prefetch-accurate 68000 interpreter core.
# Its group-0 (bus/address error) exception frames carry the EXACT
# faulting PC, instruction register and access address, which software
# that virtualizes hardware through bus-error traps requires to decode
# and resume the faulted instruction (field case: Spectre GCR's Mac
# world-switch). Slower than the fast interpreter.
# ONLY honoured with 'cpu 68000' and 'jit disabled' - anything else
# logs a warning and is ignored. Env override: PISTORM_CPU_COMPAT=1.
#cpu_compatible enabled

# monitor detect (MFP GPIP bit 7). TOS reads this wire at boot to choose
# the startup resolution, and the Shifter only enters 640x400 when it
# says mono. On a PiStorm the bit comes from the monitor you actually
# have plugged in, so software REQUIRING ST high resolution cannot run on
# a colour setup. This forces what the guest sees:
#   monitor mono     pretend an SM124 is attached -> TOS boots 640x400
#   monitor colour   pretend a colour monitor is attached
#   monitor auto     use the real wire (default; same as omitting the key)
# Forcing mono on a colour monitor puts the Shifter in a mode the monitor
# genuinely cannot display, so the native screen will be garbage - enable
# native_hdmi and watch that instead.
# Field case: Spectre GCR emulates a 512x342 one-bit Macintosh screen and
# has nowhere to put it in 320x200 or 640x200.
#monitor mono

# enable FPU if CPU supports one
fpu

# enable ET4000AX graphic card emulation
# select driver type - currently NOVA, XVDI, NVDI, FVDI
#vga ET4000AX NOVA
#fps 50

# enable hdmi video for native resolutions
# mirrors native Atari resolutions LOW, MED to HDMI (best-effort - beam-raced
# effects only look right on the real shifter output)
# default is DISABLED: games/demos use the shifter, HDMI shows the Atari logo
#native_hdmi enabled

# enable DMA audio over HDMI
# only valid for STe machines - note: tuned for MOD and MP3 playback, 
# system sounds may lag
#dma_sound

# enable YM2149 (PSG) sound emulation over HDMI
# shadows the register writes the real chip still receives, so chip music,
# keyclicks and effects also play on the HDMI sink. Works on any ST config
# and is independent of dma_sound - either switch brings up HDMI audio.
ym2149

# blitter modes:
#   blitter            emulated ST BLiTTER (default) - software blit over the
#                      RAM mirror, real chip untouched; works with or without
#                      a blitter fitted, no CPLD bus arbitration needed
#   blitter real       pass register access through to the real chip
#                      (requires working bus arbitration in the CPLD)
#   blitter disabled   hide FF8A00-FF8BFF: TOS detects no blitter and uses
#                      software rendering
blitter

# USB/Bluetooth keyboard & mouse injected into the IKBD stream (evdev).
# The real ST keyboard/mouse keep working alongside; Bluetooth devices just
# need normal bluetoothctl pairing on the Pi, hotplug is automatic.
# Devices are grabbed away from the Pi console by default; F12 toggles the
# grab at runtime. Modifiers stack on the one line:
#   kbd usb              enable, auto mode: real IKBD merged when healthy,
#                        quarantined when absent/noisy (stops the console
#                        bell from a floating keyboard line)
#   kbd usb nograb       leave input devices shared with the Pi console
#   kbd usb merge        always trust the real IKBD, never quarantine
#   kbd usb standalone   ignore the real IKBD entirely - USB input only
#   kbd usb mousediv N   divide host mouse counts by N (1-16), if the USB
#                        mouse feels too fast
# e.g. "kbd usb nograb mousediv 2"
# (Native ST mouse interrupt reduction is separate and env-based:
#  PISTORM_MOUSE_THRESH=N, see platforms/atari/kbd_usb.c)
# kbd usb

# enable TT-RAM (Alt-RAM)
# TT-RAM is located at 0x01000000
# enabling this will give you upto 128MB of high performance memory
# not valid for 68000, 68010 CPU
ttram 128M

# ST-RAM size the guest should see. When set, the emulator PROBES the real
# board's DRAM banks over the bus and configures the largest real ST setup
# fitting both this request and the physical RAM - so "4M" on a 1MB board
# yields 1MB (required for a correct native display: a 4MB model puts the
# screen outside physical DRAM = scrambled picture), and "1M" on a 4MB board
# deliberately presents a 1MB machine. Values: 512K, 1M, 2M, 2560 (=2.5M), 4M.
# Omit the key entirely for the legacy flat 4MB model with no probing.
# MiNT still gets the full 128MB of FastRAM either way.
#stram_size 4M

# experimental - yields stupid fast performance for some software, but may break others
# enable stram cache (direct access to ST-RAM)
#stram_cache enabled
#stram_direct enabled

# enable HostFS via ARAnyM-compatible NatFeat HOSTFS/hostfs.xfs
# NOTE works for Mint only at the moment
# NOTE read-only for now
#hostfs S /home/pistorm/atari-share

# load TOS ROM image
rom ../roms/emutos-aranym.rom

# STBOX - sandboxed 68000 ST in a GEM window (run STBOX.PRG on the Atari)
# TOS for the sandbox: TOS 1.04/2.06 or a 192/256K EmuTOS image.
# The Aranym EmuTOS above is for the MAIN machine and will not boot the box.
# (env PISTORM_STBOX_TOS / PISTORM_STBOX_PLANE override these if set)
#stbox_tos ../roms/stbox-tos.rom
# force a specific DRM overlay plane for the sandbox video (0/unset = auto)
#stbox_plane 0

# enable IDE interface
ide

# select hard disk images to load on the IDE interfaces
# disk images will be loaded in the order they are entered
# first in your list should be the bootable image
hdd ../dkimages/dk0.img
#hdd ../dkimages/dk1.img
#hdd ../dkimages/dk2.img
#hdd ../dkimages/dk3.img
#hdd ../dkimages/dk4.img
#hdd ../dkimages/dk5.img
#hdd ../dkimages/dk6.img
#hdd ../dkimages/dk7.img

# emulated ACSI hard-disk targets on the native DMA port (ACSI-DESIGN.md).
# The period-correct storage path: AHDI/ICD/PP drivers and Spectre's Mac
# partitions talk to these; works alongside real ACSI devices - IDs of
# emulated targets are consumed, unlisted IDs pass to the real bus.
# ID selection (valid IDs 0..7):
#   acsi path            - auto: lowest free ID, in the order listed
#   acsi N:path          - pin to ID N
#   acsi N path          - same, space instead of colon
# e.g. "acsi 0 ../dkimages/boot.img" then "acsi 4:../dkimages/data.img".
# Image flavours by suffix:
#   *.img  raw Atari ACSI disk (AHDI root sector, partitions, bootable)
#   *.hfs  BARE Macintosh HFS volume - the emulator synthesizes an AHDI
#          root with one MAC partition, so Spectre mounts it while the
#          same file opens in Basilisk II / hfsutils on the Pi
#acsi ../dkimages/acsi0.img
#acsi ../dkimages/spectre.hfs

# enable FDD A: emulation (WD1772 model on the native bus)
# Takes ONE image, mounted as drive A:. Formats:
#   .st / raw .img   mounted read-write; geometry from the BPB or file
#                    size (360K/720K DD and 1.44M HD all work)
#   .msa             detected by magic (not suffix), decoded at insert
#                    time, mounted READ-ONLY (no write-back into the
#                    archive - convert to .st if the disk must save)
# .stx is not supported.
# F11 on the USB keyboard ejects / re-inserts the disk at runtime
# (needed e.g. for Spectre's "remove the floppy" prompt).
# fdd ../dkimages/fdd/720K.st

# enable FreeMiNT networking via ARAnyM-compatible NatFeat ETHERNET/nfeth.xif
# Pi-side TAP/NAT must still be configured separately after boot - use netstart.sh
network disabled
network_backend tap
network_tap tap0
network_base 0x00F10000
network_irq 4
# do not change these IP addresses
network_host_ip 192.168.50.1
network_atari_ip 192.168.50.2
network_netmask 255.255.255.0
#network_mac 52:54:50:4e:45:54
#network_debug enabled


