#
# ATARI PiSTorm JIT
# Atari PiSTorm JIT Operating System (APJ-OS)
# Bespoke XAAES / FreeMint / TeraTask / NatFeats
#

# select cpu type
# valid values are 68000, 68010, 68020, 68030, 68040, 68060
cpu 68040
fpu

vga ET4000AX FVDI
fps 60

native_hdmi enabled

kbd usb

# APJ-OS presents an STE machine identity: machine ste is the umbrella
# switch (DMA sound, STE shifter personality, blitter, _MCH cookie).
# The old bare dma_sound line is ignored by current emulators.
machine ste

# enable YM2149 (PSG) sound emulation over HDMI
ym2149

ttram 128M

# JIT translation cache. Default 8192 KB; 16384 is the compiled-in maximum.
# XaAES + fVDI + a couple of GEM apps overflow 8 MB and force hard flushes
# (watch "hard flushes/s" in PSMON). The cache is 2 MB-page backed either way.
jit_cache 16384

# experimental - yields stupid fast performance for some software, but may break others
# enable stram cache (direct access to ST-RAM)
#stram_cache enabled
#stram_direct enabled

# enable HostFS via ARAnyM-compatible NatFeat HOSTFS/hostfs.xfs
# NOTE read-only for now
hostfs S /home/pistorm/atari-share

rom ../roms/emutos-aranym.rom

ide
hdd ../dkimages/apj-os.img

fdd ../dkimages/fdd/720K.st

# enable FreeMiNT networking via ARAnyM-compatible NatFeat ETHERNET/nfeth.xif
# Pi-side TAP/NAT must still be configured separately after boot - use netstart.sh
network disabled
network_backend tap
network_tap tap0
network_base 0x00F10000
network_irq 4
# do not change these IP addresses
network_host_ip 192.168.50.1
network_atari_ip 192.168.50.2
network_netmask 255.255.255.0
#network_mac 52:54:50:4e:45:54
#network_debug enabled

