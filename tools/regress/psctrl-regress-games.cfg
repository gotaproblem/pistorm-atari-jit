# [regress-games] - the machine the regression GAME tests run on. Kept for
# the tests only: change it and the results stop comparing with earlier
# runs. A plain ST: 68000 at 8 MHz, compatible (prefetch-exact) core, JIT
# off, the ST-RAM cache and direct mapping off, no blitter, no DMA sound;
# the real Shifter's own output (no HDMI mirror yet - native_hdmi will be
# added as its own test later). TOS 2.06 with the fast-boot fix.
#
# D: is dkimages/regress-games.img (tools/regress/games-img/mkgamesimg.py),
# on IDE - ACSI causes problems with these games. C: on it is the AHDI
# driver that boots it. No floppy here: a game disk in A: would boot
# before the hard disk; the runner adds one for the floppy tests (Wrath of
# the Demon's disk swaps).
[regress-games]
rom tos206uk-fastboot.rom
machine st
shifter st
stram_size 4M
cpu 68000
fpu disabled
mmu disabled
addr32 disabled
jit_power 0
cpu_compatible enabled
cpu_speed 8mhz
stram_cache disabled
stram_direct disabled
blitter disabled
ym2149 enabled
dma_sound disabled
native_hdmi disabled
hdmi_only disabled
psvidel disabled
falcon_dsp disabled
drm_dirtyband 0
drm_async 0
acsi disabled
ide enabled
ide_byteorder native
hdd 0:regress-games.img
network disabled
network_debug disabled
kbd disabled
mouse_thresh 0
mouse_scale 1
