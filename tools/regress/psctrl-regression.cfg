# [regression] - the machine tools/regress/run.sh runs the tests.txt
# program tests on (FastBobs, Bad Apple, Paula). Kept for the tests only:
# change it and the results stop comparing with earlier runs. The runner
# adds the drives itself (the boot floppy as A:, the test image as ACSI
# ID 0 = C:), so there are no hdd/acsi image/fdd lines here.
# EmuTOS 1.3: its own ACSI driver makes the image C: (TOS 1.04 has none).
[regression]
rom etos256uk-13.rom
machine ste
shifter ste
stram_size 4M
cpu 68000
fpu disabled
mmu disabled
addr32 disabled
jit_power 0
cpu_compatible enabled
cpu_speed 8mhz
stram_cache enabled
stram_direct enabled
blitter enabled
ym2149 enabled
dma_sound enabled
native_hdmi enabled
hdmi_only disabled
psvidel disabled
falcon_dsp disabled
drm_dirtyband 0
drm_async 0
lmc 1
acsi enabled
ide disabled
network disabled
network_debug disabled
kbd disabled
mouse_thresh 0
mouse_scale 1
